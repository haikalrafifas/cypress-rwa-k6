name: Load Test Backend API with k6

on:
  workflow_dispatch:
  push:
    branches: [ develop ]

jobs:
  load-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3

      - name: Start backend API container
        run: |
          docker run -d -p 3000:3000 --name backend-api railflow/cypress-real-world-app:develop
          # Wait for backend API to be ready
          for i in {1..20}; do
            if curl -s http://localhost:3000/health; then
              echo "Backend API is up!"
              break
            else
              echo "Waiting for backend..."
              sleep 3
            fi
          done

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 load test
        run: |
          k6 run load-tests/load-test.js

      - name: Stop backend API container
        if: always()
        run: docker stop backend-api && docker rm backend-api
