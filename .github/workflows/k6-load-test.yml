name: Load Test Backend API with k6

on:
  workflow_dispatch:
  push:
    branches: [ develop ]

jobs:
  load-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3

      - name: Start backend API container
        run: |
          docker run -d -p 3000:3000 --name backend-api railflow/cypress-real-world-app:develop
          # Wait for backend API to be ready
          for i in {1..20}; do
            if curl -s http://localhost:3000/health; then
              echo "Backend API is up!"
              break
            else
              echo "Waiting for backend..."
              sleep 3
            fi
          done

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg ca-certificates curl
          curl -s https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | \
            sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
          k6 version

      - name: Run k6 load test
        run: |
          k6 run --out json=report.json tests/k6_load_test.js

      - name: Install k6-reporter
        run: npm install -g k6-reporter

      - name: Generate HTML report
        run: |
          k6-reporter report.json > report.html

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-report
          path: report.html

      - name: Stop backend API container
        if: always()
        run: docker stop backend-api && docker rm backend-api
